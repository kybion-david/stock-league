# Deploy main to Azure Static Web Apps (ADR 004, ADR 009). Runs on every push
# to main (i.e. every merged PR) and can be started by hand. Never on PRs: SWA
# Free has few preview slots and previews are disabled in infra/.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SWA's builder (Oryx) runs `npm run build` and picks Node from
      # package.json `engines`. Runtime secrets live in the SWA app settings.
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: /
          api_location: ""
          output_location: ""
