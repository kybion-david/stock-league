# Daily snapshot ingestion into the production database (ticket 013, ADR 015).
# Runs at 22:30 UTC, after the US close. Start it by hand from the Actions tab
# (or `gh workflow run daily-ingest -f date=2026-11-06`) to redo one day.
# A failed run fails the workflow, and GitHub emails whoever last edited the
# schedule.
name: daily-ingest

on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Trading date (YYYY-MM-DD). Empty = the UTC date 6 hours ago."
        required: false
        default: ""

concurrency:
  group: daily-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Scheduled runs are often late, sometimes past midnight UTC. Counting
      # back 6 hours keeps a late run on the trading date it was meant for.
      - name: Pick the trading date
        id: date
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          date="${INPUT_DATE:-$(date -u -d '6 hours ago' +%F)}"
          if ! [[ "$date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::Not a YYYY-MM-DD date: $date"
            exit 1
          fi
          echo "date=$date" >> "$GITHUB_OUTPUT"
          echo "Ingesting $date"

      # Re-runs only upsert (ADR 012), so one retry after a pause is safe and
      # rides out a short Yahoo or Neon hiccup.
      - name: Ingest snapshots
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATE: ${{ steps.date.outputs.date }}
        run: |
          if npm run ingest -- "$DATE"; then exit 0; fi
          echo "::warning::Ingestion for $DATE failed. Retrying in 10 minutes."
          sleep 600
          npm run ingest -- "$DATE"
