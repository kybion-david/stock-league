# Live market-data check from a GitHub Actions runner (ticket 010, ADR 003):
# Yahoo may block datacenter IPs, and the daily job runs on one of these.
# Runs on demand, and on PRs that touch the client.
name: market-data-live

on:
  workflow_dispatch:
  pull_request:
    paths:
      - src/lib/market-data*.ts
      - src/lib/benchmark.ts
      - .github/workflows/market-data-live.yml

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run test:live
